name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # RELEASE_NOTES.md holds the hand-written summary for this release.
      # GoReleaser reads it via {{ envOrDefault "RELEASE_HIGHLIGHTS" "" }},
      # so an absent file degrades to a changelog-only release rather than failing.
      - name: Load release highlights
        run: |
          {
            echo 'RELEASE_HIGHLIGHTS<<RELEASE_HIGHLIGHTS_EOF'
            if [ -f RELEASE_NOTES.md ]; then cat RELEASE_NOTES.md; fi
            echo 'RELEASE_HIGHLIGHTS_EOF'
          } >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
